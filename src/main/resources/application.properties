spring.application.name=polizas-api

# Base de datos en memoria
spring.datasource.url=jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Seguridad
app.security.api-key=123456

# Regla de negocio: IPC aplicado en renovaciones (5 % de ejemplo, configurable)
app.negocio.ipc=0.05

# Integración con el CORE (mock local)
app.core.base-url=http://localhost:8080
